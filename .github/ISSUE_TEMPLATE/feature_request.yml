name: 功能建議
description: 提出可改善教會行政、牧養或資料治理流程的建議。
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: "請以去識別化案例描述需求，勿包含真實會友或關懷資料。"
  - type: textarea
    id: problem
    attributes:
      label: 想解決的流程問題
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建議作法
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已考慮的替代方案
